version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - misspell
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt

run:
  timeout: 5m

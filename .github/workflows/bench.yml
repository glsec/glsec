name: Benchmarks

# Compares the rule benchmarks of a pull request with its base (#872, #880).
# Base and head run alternately in one job, so both see the same machine.
# benchstat's table of time, bytes and allocations goes to the job summary.
# The job fails only on an allocation regression: allocations hardly depend on
# the runner, while time varies by 10 to 30% even within one job, too much for
# a threshold to mean anything.

on:
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/bench.yml
      - .github/scripts/bench-compare.py
      - .github/tools/benchstat/**

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare benchmarks with the base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Built from .github/tools/benchstat, whose go.sum pins the version.
      - name: Build benchstat
        working-directory: .github/tools/benchstat
        run: go build -o "$RUNNER_TEMP/benchstat" golang.org/x/perf/cmd/benchstat

      - name: Build the base and head test binaries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          go test -c -o "$RUNNER_TEMP/head.test" ./cmd/glsec
          (cd "$RUNNER_TEMP/base" && go test -c -o "$RUNNER_TEMP/base.test" ./cmd/glsec)

      # Alternating spreads a slow phase of the runner over both sides.
      - name: Run the benchmarks
        run: |
          for _ in 1 2 3 4 5 6 7 8; do
            for side in base head; do
              dir="$GITHUB_WORKSPACE"
              [ "$side" = base ] && dir="$RUNNER_TEMP/base"
              (cd "$dir/cmd/glsec" && "$RUNNER_TEMP/$side.test" -test.run '^$' \
                -test.bench 'BenchmarkRules|BenchmarkRun' -test.benchmem -test.count 1) \
                >> "$RUNNER_TEMP/$side.txt"
            done
          done

      - name: Show benchstat
        run: |
          {
            echo "## Benchmarks: base vs head"
            echo
            echo "Time varies between runners and is shown for reading; only allocations are checked."
            echo
            echo '```'
            "$RUNNER_TEMP/benchstat" base="$RUNNER_TEMP/base.txt" head="$RUNNER_TEMP/head.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check allocations
        env:
          # A new rule adds about 1% on average; a regexp compiled once per
          # script line adds about 16%. The same code differs by a few dozen.
          ALLOCS_LIMIT: "5" # percent
          ALLOCS_MIN_DELTA: "1000" # allocations per op
        run: python3 .github/scripts/bench-compare.py "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt"

name: MegaLinter plugin

# Loads mega-linter-plugin-glsec into a real MegaLinter image and runs it
# against a clean and a failing pipeline (#557). This covers what a unit test
# cannot: the runtime install from the release assets, version detection,
# the error/warning regexes and SARIF pickup. The plugin installs the released
# glsec pinned in its descriptor, not the code in this checkout.

on:
  pull_request:
    paths:
      - mega-linter-plugin-glsec/**
      - testdata/megalinter/**
      - .github/workflows/megalinter-plugin.yml
  push:
    branches: [main]
    paths:
      - mega-linter-plugin-glsec/**
      - testdata/megalinter/**
      - .github/workflows/megalinter-plugin.yml
  # A version bump pins a release that doesn't exist until the tag is pushed,
  # so the bump PR and its push skip the run (see the first step). This tests
  # the plugin against each release once it is published (#599).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Run the plugin in MegaLinter
    runs-on: ubuntu-latest
    env:
      # Smallest flavor; plugins load into any flavor.
      MEGALINTER_IMAGE: ghcr.io/oxsecurity/megalinter-ci_light:v10.1.0@sha256:e40b320afe3152cd0e856019ff9c74a827d179ed45512148e5790871c3d08259
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The plugin installs the release pinned in the descriptor. On a version
      # bump that release doesn't exist yet: skip with a notice instead of
      # failing on the 404 (#599). When triggered by the release itself, wait
      # for GoReleaser to finish uploading the assets.
      - name: Check that the pinned release is published
        id: release
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=$(grep -oE 'GLSEC_VERSION=[0-9]+\.[0-9]+\.[0-9]+' \
            mega-linter-plugin-glsec/glsec.megalinter-descriptor.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          url="https://github.com/glsec/glsec/releases/download/v${version}/checksums.txt"
          attempts=1
          if [ "$EVENT" = "release" ]; then attempts=30; fi
          for i in $(seq 1 "$attempts"); do
            code=$(curl -sSIL -o /dev/null -w '%{http_code}' "$url")
            case "$code" in
              200)
                echo "glsec $version is published"
                echo "published=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              404) ;;
              *)
                echo "::error::unexpected HTTP $code for $url"
                exit 1
                ;;
            esac
            if [ "$i" -lt "$attempts" ]; then sleep 30; fi
          done
          if [ "$EVENT" = "release" ]; then
            echo "::error::glsec $version is still not published after the release event"
            exit 1
          fi
          echo "::notice::glsec $version is not published yet; the plugin is tested once the release exists"
          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Lint the clean and the failing pipeline
        if: steps.release.outputs.published == 'true'
        run: |
          set -euo pipefail

          megalinter() {
            mkdir -p "reports/$1"
            chmod 777 "reports/$1"
            docker run --rm \
              -v "$PWD:/tmp/lint:ro" \
              -v "$PWD/reports/$1:/tmp/reports" \
              -e DEFAULT_WORKSPACE="/tmp/lint/testdata/megalinter/$1" \
              -e PLUGINS=file:///tmp/lint/mega-linter-plugin-glsec/glsec.megalinter-descriptor.yml \
              -e ENABLE_LINTERS=GITLAB_GLSEC \
              -e VALIDATE_ALL_CODEBASE=true \
              -e REPORT_OUTPUT_FOLDER=/tmp/reports \
              -e SARIF_REPORTER=true \
              "$MEGALINTER_IMAGE"
          }

          echo "::group::good"
          megalinter good
          echo "::endgroup::"

          echo "::group::bad"
          if megalinter bad; then
            echo "::error::MegaLinter passed on testdata/megalinter/bad, expected glsec to fail it"
            exit 1
          fi
          echo "::endgroup::"

          # The container writes its reports as root.
          sudo chmod -R a+rX reports
          sarif=reports/bad/sarif/GITLAB_GLSEC.sarif
          results=$(jq '[.runs[].results[]] | length' "$sarif")
          if [ "$results" -eq 0 ]; then
            echo "::error::$sarif has no results"
            exit 1
          fi
          echo "bad pipeline: $results SARIF results"

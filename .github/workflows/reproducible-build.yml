name: Reproducible build

# Builds the release artifacts twice, from two checkouts in different
# directories, and fails if the checksums differ (#574). Anything that leaks the
# build path, the build time or the runner's user into a binary or an archive
# shows up here before it reaches a release.

on:
  pull_request:
    paths:
      - .goreleaser.yml
      - go.mod
      - go.sum
      - cmd/**
      # Tests don't change the binary.
      - "!cmd/**/*_test.go"
      - .github/workflows/build-release.yml
      - .github/workflows/reproducible-build.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    name: Build twice and compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: first
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: second/elsewhere
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: first/go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3 # same as build-release.yml
          install-only: true

      # A throwaway local tag makes this a real release build (version string,
      # archive names) rather than a snapshot; nothing is pushed or published.
      - name: Build both checkouts
        run: |
          set -euo pipefail
          for dir in first second/elsewhere; do
            (cd "$dir" && git tag v0.0.0-repro && goreleaser release --clean --skip=publish,sbom)
          done

      - name: Compare checksums
        run: |
          set -euo pipefail
          if ! diff -u first/dist/checksums.txt second/elsewhere/dist/checksums.txt; then
            echo "::error::two builds of the same commit produced different artifacts"
            exit 1
          fi
          echo "identical:"
          cat first/dist/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: |
            first/dist/*.tar.gz
            first/dist/*.zip
          if-no-files-found: error
          retention-days: 3

  # Each release archive starts and finds something on its own platform
  # (#929). These are release builds of the same source, so a broken archive
  # shows up here before a tag is pushed. darwin_amd64 has no hosted runner
  # left to run it on.
  smoke:
    name: Smoke-test the ${{ matrix.platform }} archive
    needs: rebuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux_amd64, ext: tar.gz }
          - { os: ubuntu-24.04-arm, platform: linux_arm64, ext: tar.gz }
          - { os: macos-latest, platform: darwin_arm64, ext: tar.gz }
          - { os: windows-latest, platform: windows_amd64, ext: zip }
          - { os: windows-11-arm, platform: windows_arm64, ext: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: archives
      - name: Unpack and run
        env:
          ARCHIVE: archives/glsec_0.0.0-repro_${{ matrix.platform }}.${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir unpacked
          if [[ "$ARCHIVE" == *.zip ]]; then
            # Git Bash's tar can't read zip files.
            pwsh -NoProfile -Command "Expand-Archive -Path '$ARCHIVE' -DestinationPath unpacked"
          else
            tar -xzf "$ARCHIVE" -C unpacked
          fi
          bin=unpacked/glsec
          [ -f "$bin" ] || bin=unpacked/glsec.exe
          .github/scripts/smoke-test.sh 0.0.0-repro "$bin"

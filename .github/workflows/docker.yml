name: Docker

on:
  push:
    tags:
      - "v*"

# Default-deny at the workflow level; each job grants only what it needs.
permissions: {}

jobs:
  # Tags can point at any commit, so require that CI actually passed for it
  # before publishing. Fails closed: no completed CI run means no image push.
  gate:
    name: Require green CI and a signed tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read # read .github/allowed_signers from the default branch
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed" \
            --jq '.workflow_runs[0].conclusion // "none"')
          echo "CI conclusion for $SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Image publish blocked: CI for $SHA concluded '$conclusion', expected 'success'. Wait for CI to finish, then re-run this workflow."
            exit 1
          fi

      # The workflow file comes from the tagged commit, so the list of keys
      # allowed to sign comes from the default branch instead (#1042).
      - name: Require a tag signed by a listed maintainer key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api "repos/$REPO/contents/.github/allowed_signers?ref=$DEFAULT_BRANCH" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/allowed_signers"
          git init -q "$RUNNER_TEMP/tag"
          cd "$RUNNER_TEMP/tag"
          git fetch -q --depth=1 "https://github.com/$REPO" "+refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git rev-parse "$TAG^{commit}")" != "$SHA" ]; then
            echo "::error::Image publish blocked: tag $TAG no longer points at $SHA."
            exit 1
          fi
          if ! git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" verify-tag "$TAG"; then
            echo "::error::Image publish blocked: $TAG is not signed by a key in .github/allowed_signers on $DEFAULT_BRANCH. Sign it with git tag -s (see RELEASING.md)."
            exit 1
          fi

  docker:
    name: Build, attest and push the image
    needs: gate
    permissions:
      contents: read # checkout
      packages: write # push the image to ghcr
      id-token: write # keyless signing of the provenance via Sigstore
      attestations: write # write the attestation to the GitHub attestations API
    uses: $/.github/workflows/build-image.yml

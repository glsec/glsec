name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      # Fails when go.mod or go.sum don't match what the code imports (#681).
      - run: go mod tidy -diff
      - run: go build ./...

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    # Force bash on every OS. The Windows runner defaults to PowerShell, which
    # mangles `go test -race -coverprofile=coverage.out ./...` into a bogus
    # ".out" package argument; bash parses the command identically everywhere.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      # The race detector isn't supported on windows/arm64, so that leg runs
      # the tests without it; coverage is read from the Linux leg anyway.
      - env:
          OS: ${{ matrix.os }}
        run: |
          if [ "$OS" = windows-11-arm ]; then
            go test ./...
          else
            go test -race -coverprofile=coverage.out ./...
          fi
      # The large-pipeline tests skip themselves under -race, which makes them
      # take minutes; once without it is enough (#838).
      - if: matrix.os == 'ubuntu-latest'
        run: go test -run 'TestRulesScaleLinearly|TestLargePipelineAllFormats' -v ./cmd/glsec
      # Show coverage on the run's summary page and fail when the total drops
      # below the floor. Raise COVERAGE_FLOOR on purpose, never lower it to
      # make a change pass (#538).
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        env:
          COVERAGE_FLOOR: "92.0"
        run: |
          awk '
            NR > 1 {
              split($1, loc, ":"); pkg = loc[1]
              sub(/\/[^\/]*$/, "", pkg); sub(/^github\.com\/glsec\/glsec\/?/, "", pkg)
              if (pkg == "") pkg = "."
              stmts[$1] = $2; pkgof[$1] = pkg
              if ($3 > 0) hit[$1] = 1
            }
            END {
              for (k in stmts) {
                p = pkgof[k]; total[p] += stmts[k]; all += stmts[k]
                if (k in hit) { covered[p] += stmts[k]; allcov += stmts[k] }
              }
              for (p in total) printf "%s\t%.1f\n", p, 100 * covered[p] / total[p]
              printf "TOTAL\t%.1f\n", 100 * allcov / all
            }' coverage.out | sort > coverage.tsv

          total=$(awk -F'\t' '$1 == "TOTAL" { print $2 }' coverage.tsv)
          {
            echo "### Test coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
            echo
            echo "| Package | Coverage |"
            echo "|---|---|"
            awk -F'\t' '$1 != "TOTAL" { printf "| `%s` | %s%% |\n", $1, $2 }' coverage.tsv
          } >> "$GITHUB_STEP_SUMMARY"

          if ! awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit !(t + 0 >= f + 0) }'; then
            echo "::error::test coverage ${total}% is below the floor of ${COVERAGE_FLOOR}%"
            exit 1
          fi
          echo "test coverage ${total}% (floor ${COVERAGE_FLOOR}%)"
      # Upload coverage from one OS only — a shared artifact name collides across
      # matrix legs, and Linux coverage is representative.
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  # Publishes the coverage of main at app.codecov.io/gh/glsec/glsec, a link
  # some listings require (#559). The floor check in the Test job stays the
  # gate; this job never runs on pull requests and never fails the build.
  coverage-upload:
    name: Upload coverage to Codecov
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC upload, no stored Codecov token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      # golangci-lint's unused only sees unexported code. deadcode follows the
      # calls from main and reports exported functions nothing reaches, such as
      # a wrapper only tests still call after a refactor (#1076). It must be
      # built with the toolchain setup-go installed, or it can't load the
      # standard library.
      - run: go install golang.org/x/tools/cmd/deadcode@v0.52.0
      - name: Unreachable functions
        run: |
          deadcode -f '{{range .Funcs}}{{$.Path}}.{{.Name}}{{"\n"}}{{end}}' ./... | sort -u > "$RUNNER_TEMP/dead.txt"
          sed 's/#.*//; s/[[:space:]]*$//; /^$/d' .github/deadcode-allow.txt | sort -u > "$RUNNER_TEMP/allow.txt"
          unexpected=$(comm -23 "$RUNNER_TEMP/dead.txt" "$RUNNER_TEMP/allow.txt")
          stale=$(comm -13 "$RUNNER_TEMP/dead.txt" "$RUNNER_TEMP/allow.txt")
          if [ -n "$unexpected" ]; then
            echo "::error::Unreachable from main: remove them, or call them from production code; only list one in .github/deadcode-allow.txt with a reason"
            echo "$unexpected"
          fi
          if [ -n "$stale" ]; then
            echo "::error::Listed in .github/deadcode-allow.txt but reachable or gone: remove the entry"
            echo "$stale"
          fi
          [ -z "$unexpected" ] && [ -z "$stale" ]

  # go test -cover counts statements only; gobco counts each branch, so an
  # untested else or early return shows up here (#625). Same rule as the
  # statement floor: raise BRANCH_FLOOR on purpose, never lower it.
  branch-coverage:
    name: Branch coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/rillig/gobco@v1.3.4
      - name: Branch coverage
        env:
          BRANCH_FLOOR: "85.0"
        run: |
          for dir in $(go list -f '{{.Dir}}' ./...); do
            pkg=${dir#"$PWD"}; pkg=${pkg#/}; [ -n "$pkg" ] || pkg=.
            out=$(gobco -branch "./$pkg") || { echo "$out"; exit 1; }
            echo "$out" | sed -n "s|^Branch coverage: \([0-9]*\)/\([0-9]*\)$|$pkg\t\1\t\2|p"
          done > branches.tsv

          read -r covered total < <(awk -F'\t' '{ c += $2; t += $3 } END { print c, t }' branches.tsv)
          pct=$(awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.1f", 100 * c / t }')
          {
            echo "### Branch coverage: ${pct}% (${covered}/${total}, floor ${BRANCH_FLOOR}%)"
            echo
            echo "| Package | Branches covered |"
            echo "|---|---|"
            awk -F'\t' '$3 > 0 { printf "| `%s` | %d/%d (%.1f%%) |\n", $1, $2, $3, 100 * $2 / $3 }' branches.tsv
          } >> "$GITHUB_STEP_SUMMARY"

          if ! awk -v p="$pct" -v f="$BRANCH_FLOOR" 'BEGIN { exit !(p + 0 >= f + 0) }'; then
            echo "::error::branch coverage ${pct}% is below the floor of ${BRANCH_FLOOR}%"
            exit 1
          fi
          echo "branch coverage ${pct}% (floor ${BRANCH_FLOOR}%)"

  license-headers:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pattern below is not a license expression for reuse lint.
      # REUSE-IgnoreStart
      - name: Every source file carries the SPDX license line
        run: |
          missing=$(git ls-files '*.go' Dockerfile Makefile bin/glsec \
            | xargs grep -L -E '^(//|#) SPDX-License-Identifier: Apache-2\.0$' || true)
          if [ -n "$missing" ]; then
            echo "::error::files without a license header (see CONTRIBUTING.md#license-headers):"
            echo "$missing"
            exit 1
          fi
      # REUSE-IgnoreEnd
      - name: Install reuse
        # Version and hash pinned in .github/requirements/reuse.txt (#684).
        run: pip install --require-hashes --no-deps -r .github/requirements/reuse.txt
      # Every file has a license, the license texts are in LICENSES/ (#684).
      - run: reuse lint

  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The action sets up its own Go, by default the newest stable release,
      # and its setup-go ignores the toolchain line in go.mod. Pass that
      # toolchain explicitly: the release is built with it, so an outdated
      # toolchain must fail here (#664).
      - name: Read the Go toolchain from go.mod
        id: toolchain
        run: |
          version=$(go mod edit -json | jq -r '.Toolchain // ("go" + .Go)')
          echo "version=${version#go}" >> "$GITHUB_OUTPUT"
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ steps.toolchain.outputs.version }}

  # The OSV database also carries the OpenSSF malicious-packages feed, which
  # govulncheck doesn't check (#613).
  osv-scanner:
    name: Security (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            --lockfile=requirements.txt:./.github/requirements/check-jsonschema.txt
            --lockfile=requirements.txt:./.github/requirements/zizmor.txt
            --lockfile=requirements.txt:./.github/requirements/reuse.txt
            ./

  dependency-review:
    name: Security (dependency review)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, PSF-2.0, Unlicense, 0BSD
          # reuse (GPL-3.0) and its dependency python-debian (GPL-2.0) only run in
          # the license headers job; nothing from them ships with glsec (#684).
          allow-dependencies-licenses: pkg:pypi/reuse, pkg:pypi/python-debian

  zizmor:
    name: Security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        # Version and hash pinned in .github/requirements/zizmor.txt (#539).
        run: pip install --require-hashes --no-deps -r .github/requirements/zizmor.txt
      - name: Run zizmor
        run: zizmor --gh-token "${{ secrets.GITHUB_TOKEN }}" .github/workflows/

  cfgaudit:
    name: Security (cfgaudit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The config lives outside the workspace, so a .cfgaudit.yml in the pull
      # request can't turn rules off (#688); the action mounts it read-only.
      # content-paths scans the Markdown docs for hidden content (#708).
      - name: Write the scan config
        run: |
          cat > "$RUNNER_TEMP/cfgaudit.yml" <<'YAML'
          content-paths:
            - "*.md"
            - "docs/**/*.md"
            - ".github/**/*.md"
          YAML
      - name: Scan agent instructions, settings, the plugin package and docs
        uses: cfgaudit/cfgaudit@d490362f1889e84c2704ae304a0e6bb1863697fa # v1.18.1
        with:
          plugins: .
          config: ${{ runner.temp }}/cfgaudit.yml
          strict: "true"

  trivy:
    name: Security (Trivy image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t glsec:ci .
      # The image starts and finds something, the way users run it (#929).
      - name: Smoke-test the image
        run: .github/scripts/smoke-test.sh dev docker run --rm -v "$PWD/testdata:/src/testdata:ro" -w /src glsec:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: glsec:ci
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  hadolint:
    name: Security (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.14.0 hadolint - < Dockerfile

  dockle:
    name: Security (dockle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t glsec:ci .
      - name: Lint image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.15 --exit-code 1 --exit-level warn glsec:ci

  validate-fixtures:
    name: Validate GitLab CI fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version and hashes pinned in .github/requirements/check-jsonschema.txt (#539).
      - run: pip install --require-hashes --no-deps -r .github/requirements/check-jsonschema.txt
      # A fixture whose rule reports something the schema rejects starts with
      # a "# schema: skip" comment that says why (#727).
      - name: Validate against GitLab CI schema
        run: |
          mapfile -t fixtures < <(grep -L '^# schema: skip' testdata/fixtures/*.yml)
          check-jsonschema --builtin-schema gitlab-ci "${fixtures[@]}"
      # The trigger and safe examples in docs/rules have to be valid pipelines
      # too, or readers copy something GitLab rejects (#696).
      - name: Validate the rule doc examples against GitLab CI schema
        run: |
          python3 .github/scripts/doc-examples.py "$RUNNER_TEMP/doc-examples"
          check-jsonschema --builtin-schema gitlab-ci "$RUNNER_TEMP"/doc-examples/*.yml
      # The gitlab-sast writer's golden report has to match GitLab's SAST report
      # schema, pinned by version and hash (#846).
      - name: Validate the GitLab SAST report against GitLab's schema
        env:
          SCHEMA_URL: https://gitlab.com/gitlab-org/security-products/security-report-schemas/-/raw/v15.2.1/dist/sast-report-format.json
          SCHEMA_SHA256: f3d877b4ecb519775bb268be0544284a09a01d54c29e4fcc6cb8fed3d91ae1bf
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sast-report-format.json" "$SCHEMA_URL"
          echo "$SCHEMA_SHA256  $RUNNER_TEMP/sast-report-format.json" | sha256sum -c -
          check-jsonschema --schemafile "$RUNNER_TEMP/sast-report-format.json" internal/output/testdata/gitlab-sast.golden.json
      # The SARIF, Code Quality and JUnit writers' golden reports have to match
      # their formats too (#927): the OASIS SARIF 2.1.0 schema, the fields
      # GitLab documents for Code Quality (it publishes no schema), and the
      # JUnit XSD of Jenkins' xUnit plugin, pinned by commit and hash.
      - name: Validate the SARIF report against the SARIF 2.1.0 schema
        env:
          SCHEMA_URL: https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json
          SCHEMA_SHA256: c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sarif-schema-2.1.0.json" "$SCHEMA_URL"
          echo "$SCHEMA_SHA256  $RUNNER_TEMP/sarif-schema-2.1.0.json" | sha256sum -c -
          check-jsonschema --schemafile "$RUNNER_TEMP/sarif-schema-2.1.0.json" internal/output/testdata/sarif.golden.json
      # The .glsec.yml schema has to be a valid schema, and the documented
      # example has to match it (#832).
      - name: Validate the example .glsec.yml against the config schema
        run: |
          check-jsonschema --check-metaschema schema/glsec.schema.json
          check-jsonschema --schemafile schema/glsec.schema.json docs/glsec.example.yml
      - name: Validate the Code Quality report against GitLab's documented fields
        run: check-jsonschema --schemafile internal/output/testdata/codequality.schema.json internal/output/testdata/codequality.golden.json
      - name: Validate the JUnit report against the JUnit XSD
        env:
          SCHEMA_URL: https://raw.githubusercontent.com/jenkinsci/xunit-plugin/ae25da5089d4f94ac6c4669bf736e4d416cc4665/src/main/resources/org/jenkinsci/plugins/xunit/types/model/xsd/junit-10.xsd
          SCHEMA_SHA256: a1a816f58d1bf95ebabf371994df0b9246dee66ea9572fbec4f9296f1b2c0ff6
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/junit-10.xsd" "$SCHEMA_URL"
          echo "$SCHEMA_SHA256  $RUNNER_TEMP/junit-10.xsd" | sha256sum -c -
          if ! command -v xmllint >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libxml2-utils
          fi
          xmllint --noout --schema "$RUNNER_TEMP/junit-10.xsd" internal/output/testdata/junit.golden.xml
      # The pipeline inventory's golden BOM has to match the CycloneDX 1.6
      # schema, which references two more schema files; all three are pinned
      # by release and hash (#830).
      - name: Validate the pipeline inventory against the CycloneDX schema
        env:
          CDX_BASE: https://raw.githubusercontent.com/CycloneDX/specification/1.6.2/schema
        run: |
          dir="$RUNNER_TEMP/cyclonedx"
          mkdir -p "$dir"
          for f in bom-1.6.schema.json spdx.schema.json jsf-0.82.schema.json; do
            curl -fsSL --retry 3 -o "$dir/$f" "$CDX_BASE/$f"
          done
          (cd "$dir" && sha256sum -c -) <<'SUMS'
          18f57f7482593bad9f21b4feed09084640cbeff419d62ad5090c5ceccca5b37d  bom-1.6.schema.json
          c41917196639055e9f9670811bac23ef777732144f3ff5a2f39686f61580dbe6  spdx.schema.json
          8bae002c25e723db7ee1f26afde680ae1a2b1a8f6b4b4b0fd65dc3becb090aae  jsf-0.82.schema.json
          SUMS
          check-jsonschema --schemafile "$dir/bom-1.6.schema.json" internal/inventory/testdata/pipeline.cdx.json

  # The schema checks structure only; GitLab's linter also rejects an undefined
  # stage or a file without a visible job (#840). Pull requests from forks get
  # no secrets, so their files are linted on the push to main after the merge.
  gitlab-ci-lint:
    name: Lint fixtures and rule doc examples with GitLab
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look up the GitLab version
        id: gitlab
        env:
          GITLAB_LINT_TOKEN: ${{ secrets.GITLAB_LINT_TOKEN }}
          GITLAB_LINT_PROJECT: ${{ vars.GITLAB_LINT_PROJECT }}
        run: python3 .github/scripts/gitlab-ci-lint.py version >> "$GITHUB_OUTPUT"
      # One cache entry per GitLab major.minor: a new release lints every file
      # again, in between only new or changed files are sent.
      - if: steps.gitlab.outputs.version != 'none'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gitlab-ci-lint-cache
          key: gitlab-ci-lint-${{ steps.gitlab.outputs.version }}-${{ github.run_id }}
          restore-keys: gitlab-ci-lint-${{ steps.gitlab.outputs.version }}-
      # A file whose rule reports something GitLab rejects carries a
      # "lint: skip" comment that says why.
      - if: steps.gitlab.outputs.version != 'none'
        name: Lint with the GitLab CI Lint API
        env:
          GITLAB_LINT_TOKEN: ${{ secrets.GITLAB_LINT_TOKEN }}
          GITLAB_LINT_PROJECT: ${{ vars.GITLAB_LINT_PROJECT }}
        run: |
          python3 .github/scripts/doc-examples.py "$RUNNER_TEMP/doc-examples" lint
          mapfile -t fixtures < <(grep -L '^# lint: skip' testdata/fixtures/*.yml)
          python3 .github/scripts/gitlab-ci-lint.py lint "$RUNNER_TEMP/gitlab-ci-lint-cache" \
            "${fixtures[@]}" "$RUNNER_TEMP"/doc-examples/*.yml

  version-pins:
    name: Check version pins agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The Claude Code plugin ships its own version pin and downloads the
      # matching release asset, so a release bump that misses it leaves plugin
      # users on an old glsec (#441). The MegaLinter plugin does the same
      # (#557), and the README loads its descriptor from the release tag (#649).
      # The GitLab component version
      # (gitlab.com/glsec-io/...@vX.Y.Z) is released separately and excluded.
      - name: Compare plugin pins against README and docs
        run: |
          set -euo pipefail

          want=$(jq -r .version .claude-plugin/plugin.json)
          echo "plugin.json: $want"

          found=$(
            {
              grep -oE 'VERSION="[0-9]+\.[0-9]+\.[0-9]+"' bin/glsec |
                grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
              grep -oE 'GLSEC_VERSION=[0-9]+\.[0-9]+\.[0-9]+' \
                mega-linter-plugin-glsec/glsec.megalinter-descriptor.yml |
                grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
              grep -hoE \
                -e 'glsec_[0-9]+\.[0-9]+\.[0-9]+_' \
                -e 'ghcr\.io/glsec/glsec:[0-9]+\.[0-9]+\.[0-9]+' \
                -e 'releases/download/v[0-9]+\.[0-9]+\.[0-9]+' \
                -e 'glsec/glsec/v[0-9]+\.[0-9]+\.[0-9]+/mega-linter-plugin-glsec' \
                -e 'rev: v[0-9]+\.[0-9]+\.[0-9]+' \
                -e 'GLSEC_VERSION: "[0-9]+\.[0-9]+\.[0-9]+"' \
                -e '`[0-9]+\.[0-9]+\.[0-9]+`, not `:latest`' \
                README.md docs/*.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
            } | sort -u
          )

          if [ "$found" != "$want" ]; then
            echo "::error::version pins disagree; expected $want everywhere, found:"
            printf '%s\n' "$found"
            exit 1
          fi
          echo "all pins agree on $want"

      # The marketplace installs the plugin from a release commit (#694). The
      # pin lags plugin.json between a release bump and the follow-up after
      # tagging, so only check that sha is the commit of the tag in ref.
      - name: Check the plugin source pins a release tag
        run: |
          set -euo pipefail
          ref=$(jq -r '.plugins[0].source.ref' .claude-plugin/marketplace.json)
          sha=$(jq -r '.plugins[0].source.sha' .claude-plugin/marketplace.json)
          tagged=$(git rev-parse --verify --quiet "refs/tags/$ref^{commit}" || true)
          if [ "$tagged" != "$sha" ]; then
            echo "::error::marketplace.json pins $ref at $sha, but that tag is ${tagged:-missing}"
            exit 1
          fi
          echo "plugin pinned to $ref ($sha)"

      # "requires Go X.Y+" in the docs must follow the go directive in go.mod
      # (#587); the docs said 1.25+ while go.mod required 1.26.
      - name: Compare documented Go version against go.mod
        run: |
          set -euo pipefail
          want=$(awk '$1 == "go" { split($2, v, "."); print v[1] "." v[2]; exit }' go.mod)
          echo "go.mod: $want"
          found=$(grep -hoE 'Go [0-9]+\.[0-9]+\+' README.md CONTRIBUTING.md | grep -oE '[0-9]+\.[0-9]+' | sort -u)
          if [ -z "$found" ] || [ "$found" != "$want" ]; then
            echo "::error::documented Go version disagrees with go.mod ($want), found:"
            printf '%s\n' "${found:-<none>}"
            exit 1
          fi
          echo "docs agree on Go $want+"

      # The GitLab component is versioned separately from glsec, but every
      # reference to it in the README and docs must name the same release (#587).
      - name: Compare GitLab component references in README and docs
        run: |
          set -euo pipefail
          found=$(grep -hoE 'gitlab\.com/glsec-io/glsec/[a-z-]+@v[0-9]+\.[0-9]+\.[0-9]+' README.md docs/*.md |
            grep -oE '@v[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          if [ "$(printf '%s\n' "$found" | grep -c .)" -ne 1 ]; then
            echo "::error::README and docs reference more than one GitLab component version:"
            printf '%s\n' "$found"
            exit 1
          fi
          echo "component references agree on ${found#@}"

      # Users embed assets/badge/v1.json through shields.io's endpoint badge
      # (#592); a broken file breaks every README that shows it.
      - name: Check the user badge definition
        run: |
          set -euo pipefail
          jq -e '.schemaVersion == 1 and (.label | length > 0) and (.message | length > 0)' assets/badge/v1.json
          if [ "$(jq -r .logoSvg assets/badge/v1.json)" != "$(tr -d '\n' < assets/badge/glsec-shield.svg)" ]; then
            echo "::error::assets/badge/v1.json logoSvg differs from assets/badge/glsec-shield.svg"
            exit 1
          fi
          echo "badge definition ok"

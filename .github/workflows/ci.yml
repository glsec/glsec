name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go build ./...

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Force bash on every OS. The Windows runner defaults to PowerShell, which
    # mangles `go test -race -coverprofile=coverage.out ./...` into a bogus
    # ".out" package argument; bash parses the command identically everywhere.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go test -race -coverprofile=coverage.out ./...
      # Show coverage on the run's summary page and fail when the total drops
      # below the floor. Raise COVERAGE_FLOOR on purpose, never lower it to
      # make a change pass (#538).
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        env:
          COVERAGE_FLOOR: "83.0"
        run: |
          awk '
            NR > 1 {
              split($1, loc, ":"); pkg = loc[1]
              sub(/\/[^\/]*$/, "", pkg); sub(/^github\.com\/glsec\/glsec\/?/, "", pkg)
              if (pkg == "") pkg = "."
              stmts[$1] = $2; pkgof[$1] = pkg
              if ($3 > 0) hit[$1] = 1
            }
            END {
              for (k in stmts) {
                p = pkgof[k]; total[p] += stmts[k]; all += stmts[k]
                if (k in hit) { covered[p] += stmts[k]; allcov += stmts[k] }
              }
              for (p in total) printf "%s\t%.1f\n", p, 100 * covered[p] / total[p]
              printf "TOTAL\t%.1f\n", 100 * allcov / all
            }' coverage.out | sort > coverage.tsv

          total=$(awk -F'\t' '$1 == "TOTAL" { print $2 }' coverage.tsv)
          {
            echo "### Test coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
            echo
            echo "| Package | Coverage |"
            echo "|---|---|"
            awk -F'\t' '$1 != "TOTAL" { printf "| `%s` | %s%% |\n", $1, $2 }' coverage.tsv
          } >> "$GITHUB_STEP_SUMMARY"

          if ! awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit !(t + 0 >= f + 0) }'; then
            echo "::error::test coverage ${total}% is below the floor of ${COVERAGE_FLOOR}%"
            exit 1
          fi
          echo "test coverage ${total}% (floor ${COVERAGE_FLOOR}%)"
      # Upload coverage from one OS only — a shared artifact name collides across
      # matrix legs, and Linux coverage is representative.
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0

  zizmor:
    name: Security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        # Version and hash pinned in .github/requirements/zizmor.txt (#539).
        run: pip install --require-hashes --no-deps -r .github/requirements/zizmor.txt
      - name: Run zizmor
        run: zizmor --gh-token "${{ secrets.GITHUB_TOKEN }}" .github/workflows/

  trivy:
    name: Security (Trivy image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t glsec:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: glsec:ci
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  hadolint:
    name: Security (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.14.0 hadolint - < Dockerfile

  dockle:
    name: Security (dockle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t glsec:ci .
      - name: Lint image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.15 --exit-code 1 --exit-level warn glsec:ci

  validate-fixtures:
    name: Validate GitLab CI fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version and hashes pinned in .github/requirements/check-jsonschema.txt (#539).
      - run: pip install --require-hashes --no-deps -r .github/requirements/check-jsonschema.txt
      - name: Validate against GitLab CI schema
        run: check-jsonschema --builtin-schema gitlab-ci testdata/fixtures/*.yml

  version-pins:
    name: Check version pins agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Claude Code plugin ships its own version pin and downloads the
      # matching release asset, so a release bump that misses it leaves plugin
      # users on an old glsec (#441). The MegaLinter plugin does the same
      # (#557). The GitLab component version
      # (gitlab.com/glsec-io/...@vX.Y.Z) is released separately and excluded.
      - name: Compare plugin pins against README
        run: |
          set -euo pipefail

          want=$(jq -r .version .claude-plugin/plugin.json)
          echo "plugin.json: $want"

          found=$(
            {
              grep -oE 'VERSION="[0-9]+\.[0-9]+\.[0-9]+"' bin/glsec |
                grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
              grep -oE 'GLSEC_VERSION=[0-9]+\.[0-9]+\.[0-9]+' \
                mega-linter-plugin-glsec/glsec.megalinter-descriptor.yml |
                grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
              grep -hoE \
                -e 'glsec_[0-9]+\.[0-9]+\.[0-9]+_' \
                -e 'ghcr\.io/glsec/glsec:[0-9]+\.[0-9]+\.[0-9]+' \
                -e 'releases/download/v[0-9]+\.[0-9]+\.[0-9]+' \
                -e 'rev: v[0-9]+\.[0-9]+\.[0-9]+' \
                -e 'GLSEC_VERSION: "[0-9]+\.[0-9]+\.[0-9]+"' \
                -e '`[0-9]+\.[0-9]+\.[0-9]+`, not `:latest`' \
                README.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
            } | sort -u
          )

          if [ "$found" != "$want" ]; then
            echo "::error::version pins disagree; expected $want everywhere, found:"
            printf '%s\n' "$found"
            exit 1
          fi
          echo "all pins agree on $want"

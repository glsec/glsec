name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go build ./...

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Force bash on every OS. The Windows runner defaults to PowerShell, which
    # mangles `go test -race -coverprofile=coverage.out ./...` into a bogus
    # ".out" package argument; bash parses the command identically everywhere.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go test -race -coverprofile=coverage.out ./...
      # Upload coverage from one OS only — a shared artifact name collides across
      # matrix legs, and Linux coverage is representative.
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0

  zizmor:
    name: Security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: pip install zizmor==1.29.0
      - name: Run zizmor
        run: zizmor --gh-token "${{ secrets.GITHUB_TOKEN }}" .github/workflows/

  trivy:
    name: Security (Trivy image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t glsec:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: glsec:ci
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  hadolint:
    name: Security (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.14.0 hadolint - < Dockerfile

  dockle:
    name: Security (dockle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t glsec:ci .
      - name: Lint image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.15 --exit-code 1 --exit-level warn glsec:ci

  validate-fixtures:
    name: Validate GitLab CI fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install check-jsonschema
      - name: Validate against GitLab CI schema
        run: check-jsonschema --builtin-schema gitlab-ci testdata/fixtures/*.yml

  version-pins:
    name: Check version pins agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Claude Code plugin ships its own version pin and downloads the
      # matching release asset, so a release bump that misses it leaves plugin
      # users on an old glsec (#441). The GitLab component version
      # (gitlab.com/glsec-io/...@vX.Y.Z) is released separately and excluded.
      - name: Compare plugin pins against README
        run: |
          set -euo pipefail

          want=$(jq -r .version .claude-plugin/plugin.json)
          echo "plugin.json: $want"

          found=$(
            {
              grep -oE 'VERSION="[0-9]+\.[0-9]+\.[0-9]+"' bin/glsec |
                grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
              grep -hoE \
                -e 'glsec_[0-9]+\.[0-9]+\.[0-9]+_' \
                -e 'ghcr\.io/glsec/glsec:[0-9]+\.[0-9]+\.[0-9]+' \
                -e 'releases/download/v[0-9]+\.[0-9]+\.[0-9]+' \
                -e 'rev: v[0-9]+\.[0-9]+\.[0-9]+' \
                -e 'GLSEC_VERSION: "[0-9]+\.[0-9]+\.[0-9]+"' \
                -e '`[0-9]+\.[0-9]+\.[0-9]+`, not `:latest`' \
                README.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
            } | sort -u
          )

          if [ "$found" != "$want" ]; then
            echo "::error::version pins disagree; expected $want everywhere, found:"
            printf '%s\n' "$found"
            exit 1
          fi
          echo "all pins agree on $want"

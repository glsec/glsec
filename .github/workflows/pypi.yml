name: PyPI

# Publishes a release to PyPI as platform wheels (#911), so `pipx install
# glsec` and `uvx glsec` work. The wheels carry the binaries of the GitHub
# release, not a rebuild: the archives are checked against checksums.txt and
# the provenance of build-release.yml before they are packed.
# Runs after a successful Release workflow; a release created with
# GITHUB_TOKEN triggers no `release` event. Run it by hand to publish an
# existing tag. Upload is via PyPI Trusted Publishing from the `pypi`
# environment, which needs a maintainer's approval; no token is stored.

on:
  # Release runs only for tag pushes. This workflow checks out the default
  # branch, takes nothing from the triggering run but its tag name (checked
  # below), and verifies the release archives before using them.
  workflow_run: # zizmor: ignore[dangerous-triggers] see above
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.24.1
        required: true

# Default-deny; each job grants only what it needs.
permissions: {}

concurrency:
  group: pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build the wheels
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read # download the release assets
      attestations: read # verify their provenance
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          # tmaproduction.blob.core.windows.net: gh attestation verify fetches
          # the attestation bundles from there.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            tmaproduction.blob.core.windows.net:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            productionresultssa10.blob.core.windows.net:443
            productionresultssa11.blob.core.windows.net:443
            productionresultssa12.blob.core.windows.net:443
            productionresultssa13.blob.core.windows.net:443
            productionresultssa14.blob.core.windows.net:443
            productionresultssa15.blob.core.windows.net:443
            productionresultssa16.blob.core.windows.net:443
            productionresultssa17.blob.core.windows.net:443
            productionresultssa18.blob.core.windows.net:443
            productionresultssa19.blob.core.windows.net:443

      # The script comes from the default branch, not from the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="${INPUT_TAG:-$RUN_TAG}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download and verify the release archives
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$TAG" --repo "$REPO" --dir dist \
            --pattern checksums.txt --pattern '*.tar.gz' --pattern '*.zip'
          cd dist
          # checksums.txt also lists the SBOMs, which aren't needed here;
          # build-wheels.py fails if one of the six archives is missing.
          sha256sum --check --strict --ignore-missing checksums.txt
          for f in checksums.txt *.tar.gz *.zip; do
            gh attestation verify "$f" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/build-release.yml" \
              --source-ref "refs/tags/$TAG"
          done

      - name: Build the wheels
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: python3 .github/scripts/build-wheels.py "$VERSION" dist wheels

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: wheels/*.whl
          if-no-files-found: error

  # Each wheel installs and runs on its platform before anything is uploaded
  # (#929): pip picks the wheel that matches the runner, as it would for a
  # user. The Linux leg also tries the musl tag in an Alpine container.
  smoke:
    name: Smoke-test the wheel on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheels
      # The runner's own architecture, so pip picks the arm64 wheel on an
      # arm64 runner.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install from the wheels and run
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv venv
          bin=venv/bin
          [ -d "$bin" ] || bin=venv/Scripts
          # Pin the install to the hashes of the wheels the build job made, so
          # pip takes exactly those (and Scorecard sees a hash-pinned install).
          "$bin/python" -c 'import glob, hashlib, sys; print("glsec==" + sys.argv[1], *("--hash=sha256:" + hashlib.sha256(open(w, "rb").read()).hexdigest() for w in sorted(glob.glob("wheels/*.whl"))))' "$VERSION" > smoke-requirements.txt
          "$bin/python" -m pip install --require-hashes --no-index --find-links wheels -r smoke-requirements.txt
          .github/scripts/smoke-test.sh "$VERSION" "$bin/glsec"
      - name: Install the musl wheel in Alpine and run
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION \
            python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8 \
            sh -c 'apk add --no-cache bash >/dev/null && python -m venv /venv && /venv/bin/pip install -q --require-hashes --no-index --find-links wheels -r smoke-requirements.txt && .github/scripts/smoke-test.sh "$VERSION" /venv/bin/glsec'

  publish:
    name: Publish to PyPI
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/glsec/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing and PyPI attestations
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          # pypi.python.org: twine's skip-existing check.
          # timestamp.sigstore.dev: the timestamp on PyPI's attestations.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            pypi.org:443
            pypi.python.org:443
            upload.pypi.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            productionresultssa10.blob.core.windows.net:443
            productionresultssa11.blob.core.windows.net:443
            productionresultssa12.blob.core.windows.net:443
            productionresultssa13.blob.core.windows.net:443
            productionresultssa14.blob.core.windows.net:443
            productionresultssa15.blob.core.windows.net:443
            productionresultssa16.blob.core.windows.net:443
            productionresultssa17.blob.core.windows.net:443
            productionresultssa18.blob.core.windows.net:443
            productionresultssa19.blob.core.windows.net:443

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheels

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels/
          # A re-run after a partial upload skips the wheels already there.
          skip-existing: true

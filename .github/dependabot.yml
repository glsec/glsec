version: 2

# cooldown holds back a version update until the release has been out for a
# while, which is the window in which a compromised release is usually caught
# and pulled. GitHub's built-in default is 3 days, so 7 is the first value that
# changes anything. Security updates are exempt from cooldown, so CVE fixes are
# not delayed by it.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # The Dockerfile pins its base images by digest. Upstream rebuilds a tag in
  # place to ship OS security fixes, and the Trivy image gate fails until the
  # new digest lands, so these updates run daily and skip the cooldown (#539).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5

  # CI tools installed with pip (zizmor, check-jsonschema, reuse). The .txt files are
  # pip-compile output with hashes; Dependabot recompiles them on update.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

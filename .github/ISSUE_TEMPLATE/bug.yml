name: Bug
description: glsec crashes, errors, or behaves differently from its documentation
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: glsec version
      description: Output of `glsec --version`.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command, including flags, or the CI integration you use (component, Docker image, binary, pre-commit, MegaLinter).
    validations:
      required: true
  - type: textarea
    id: pipeline
    attributes:
      label: Minimal pipeline
      description: The smallest `.gitlab-ci.yml` (or snippet) that shows the problem. Remove anything private.
      render: yaml
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Output, exit code, error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

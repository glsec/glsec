paths:
  .github/workflows/**/*.yml:
    ignore:
      # actionlint 1.7.12 doesn't know GitHub's $/ self-repository syntax yet.
      - 'reusable workflow call "\$/\.github/workflows/'
      - 'specifying action "\$/\.github/actions/'

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/SAST-IaC.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/DAST.gitlab-ci.yml

stages:
  - test
  - security
  - dast

build:
  stage: test
  image: node:20.11.0
  script:
    - npm ci
    - npm test

dast:
  allow_failure: true

secret_detection:
  rules:
    - when: never

semgrep-sast:
  rules:
    - when: never

# the template already sets allow_failure: true here, so this is not reported
iac-sast:
  allow_failure: true

stages:
  - build
  - publish

build:
  stage: build
  image: python:3.12.4
  script:
    - python -m pip install build==1.2.2
    - python -m build
  artifacts:
    paths: [dist/]
    expire_in: 1 day

publish-pypi:
  stage: publish
  image: python:3.12.4
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - python -m pip install twine==5.1.1
    - twine upload dist/*

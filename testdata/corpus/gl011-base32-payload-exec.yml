# GL011: base32 payloads and decode-to-file-then-execute (#1346). All payloads
# are harmless synthetic base32; no command here is executed by the tests.
into-shell:
  script:
    - printf %s OBZGS3TUMYQGQZLMNRXSA53POJWGIIDBEBUGC4TNNRSXG4ZAON4W45DIMV2GSYZAOBQXS3DPMFSCA33ONR4SAZTPOIQHI2DFEB2GK43UEBRW64TQOVZQ==== | base32 -d | sh
decode-and-run:
  script:
    - printf %s OBZGS3TUMYQGQZLMNRXSA53POJWGIIDBEBUGC4TNNRSXG4ZAON4W45DIMV2GSYZAOBQXS3DPMFSCA33ONR4SAZTPOIQHI2DFEB2GK43UEBRW64TQOVZQ==== | base32 -d > .patterns
    - printf %s OBZGS3TUMYQGQZLMNRXSA53POJWGIIDBEBUGC4TNNRSXG4ZAON4W45DIMV2GSYZAOBQXS3DPMFSCA33ONR4SAZTPOIQHI2DFEB2GK43UEBRW64TQOVZQ==== | base32 -d > .sweep
    - '{ timeout 5 sh .sweep "" .patterns; } 2>/dev/null | base32 -w 120'
decode-only:
  script:
    - printf %s OBZGS3TUMYQGQZLMNRXSA53POJWGIIDBEBUGC4TNNRSXG4ZAON4W45DIMV2GSYZAOBQXS3DPMFSCA33ONR4SAZTPOIQHI2DFEB2GK43UEBRW64TQOVZQ==== | base32 -d > .cfg

# #1300: a presence check does not make a later print safe, and ${VAR:-x}
# still emits the secret when set; ${VAR:+x} only emits x.
job:
  script:
    - 'test -n "$CI_JOB_TOKEN" && echo "$CI_JOB_TOKEN"'
    - 'echo "${CI_JOB_TOKEN:-missing}"'
    - 'echo "${CI_JOB_TOKEN:+ (set)}"'
    - 'bash -eo pipefail -c "true; echo $DEPLOY_TOKEN"'
    - 'bash -o pipefail -c "true; echo $DEPLOY_TOKEN"'
    - 'bash --login -c "true; echo $DEPLOY_TOKEN"'
    - 'eval "true; echo $DEPLOY_TOKEN"'
    - 'su app -c "cd /app; echo $DEPLOY_TOKEN"'
    - "ssh host 'echo $DEPLOY_TOKEN'"

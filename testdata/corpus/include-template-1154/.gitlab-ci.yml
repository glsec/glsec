# #1154: what depends on the job is reported at the job, naming the template's
# line, once for all jobs using it. What depends on the template alone stays in
# its file.
include:
  - local: ci/tpl.yml
workflow:
  rules:
    - if: $CI_COMMIT_TAG
publish:
  extends: .node
  image: node:22.11.0
  script:
    - npm publish
publish-again:
  extends: .node
  image: node:22.11.0
  script:
    - npm publish

# #295, #301, #306: the --password-stdin idiom, a job-token header and a credential helper are not secrets printed to the log.
login:
  before_script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
  script:
    - |
      if curl --max-filesize 1M -H "JOB-TOKEN: $CI_JOB_TOKEN" -sLO $PACKAGE_URL 2>/dev/null; then
        echo "Found dependencies in package registry."
      fi
    - git config --local credential.helper "!echo \"password=$LOCKFILE_UPDATE_GITLAB_TOKEN\"; :"
leak:
  script:
    - echo "token is $DEPLOY_TOKEN"

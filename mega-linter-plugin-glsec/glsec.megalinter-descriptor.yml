# MegaLinter plugin for glsec (#557).
#
# Use it from .mega-linter.yml:
#
#   PLUGINS:
#     - https://raw.githubusercontent.com/glsec/glsec/vX.Y.Z/mega-linter-plugin-glsec/glsec.megalinter-descriptor.yml
#
# with vX.Y.Z a release tag, so the descriptor (and with it the glsec version)
# only changes when you change the URL.
#
# MegaLinter runs plugin installs at startup, and only `RUN` lines, so the
# install below downloads the release archive and verifies it against
# checksums.txt. GLSEC_VERSION moves with each release; the version-pins CI
# job fails if it drifts from .claude-plugin/plugin.json.
descriptor_id: GITLAB
descriptor_type: tooling_format
descriptor_flavors:
  - all_flavors
file_names_regex:
  - "\\.gitlab-ci\\.ya?ml"
  - ".+\\.gitlab-ci\\.ya?ml"
linters:
  - linter_name: glsec
    linter_text: |
      **glsec** is a static security linter for GitLab CI/CD configuration. It finds script injection through user-controlled CI variables, unpinned images, includes and CI/CD Catalog components, leaked secrets, and other pipeline misconfigurations. Findings map to the OWASP Top 10 CI/CD Security Risks and CWE.

      It runs offline and needs no GitLab API token.
    linter_url: https://github.com/glsec/glsec
    linter_repo: https://github.com/glsec/glsec
    linter_rules_url: https://github.com/glsec/glsec/blob/main/docs/rules.md
    linter_rules_configuration_url: https://github.com/glsec/glsec#exit-codes
    linter_rules_inline_disable_url: https://github.com/glsec/glsec#suppressions
    linter_spdx_license: Apache-2.0
    cli_lint_mode: list_of_files
    supported_cli_lint_modes:
      - file
      - list_of_files
    # FORCE_COLOR in the environment would otherwise put ANSI codes in front
    # of the severity and break the counting regexes.
    cli_lint_extra_args:
      - --no-color
    cli_lint_errors_count: regex_count
    cli_lint_errors_regex: "(?m)^error\\["
    cli_lint_warnings_count: regex_count
    cli_lint_warnings_regex: "(?m)^warn\\["
    cli_version_arg_name: --version
    can_output_sarif: true
    cli_sarif_args:
      - --format
      - sarif
    examples:
      - glsec .gitlab-ci.yml
      - glsec .gitlab-ci.yml deploy.gitlab-ci.yml
    install:
      dockerfile:
        - |-
          RUN GLSEC_VERSION=1.25.0 && \
              case "$(uname -m)" in x86_64|amd64) GLSEC_ARCH=amd64 ;; aarch64|arm64) GLSEC_ARCH=arm64 ;; *) echo "glsec: unsupported architecture $(uname -m)" >&2 && exit 1 ;; esac && \
              GLSEC_ASSET="glsec_${GLSEC_VERSION}_linux_${GLSEC_ARCH}.tar.gz" && \
              GLSEC_URL="https://github.com/glsec/glsec/releases/download/v${GLSEC_VERSION}" && \
              GLSEC_TMP="$(mktemp -d)" && \
              wget -qO "${GLSEC_TMP}/${GLSEC_ASSET}" "${GLSEC_URL}/${GLSEC_ASSET}" && \
              wget -qO "${GLSEC_TMP}/checksums.txt" "${GLSEC_URL}/checksums.txt" && \
              awk -v f="${GLSEC_ASSET}" '$2 == f' "${GLSEC_TMP}/checksums.txt" > "${GLSEC_TMP}/sum" && \
              test -s "${GLSEC_TMP}/sum" && \
              (cd "${GLSEC_TMP}" && sha256sum -c sum) && \
              tar -xzf "${GLSEC_TMP}/${GLSEC_ASSET}" -C "${GLSEC_TMP}" glsec && \
              install -m 0755 "${GLSEC_TMP}/glsec" /usr/local/bin/glsec && \
              rm -rf "${GLSEC_TMP}"
    supported_platforms:
      platform:
        - linux/amd64
        - linux/arm64

#
# Known attacks behind glsec's rules. cmd/glsec/advisories_test.go checks this
# file. Wording elsewhere: glsec detects the configuration shape an attack
# used, it does not protect against the CVE.
#
# An attack is listed when it depends on something .gitlab-ci.yml can carry.
# GitLab server bugs are left out: a linter cannot see them.
#
# Keys:
#   id        CVE, GHSA or campaign name. Entries are sorted by id within their
#             kind, in the order cve, analogue, campaign.
#   aliases   other ids of the same advisory
#   repo      owner/name of the repository that publishes the GHSA, when it is
#             not in the GitHub Advisory Database
#   kind      cve       the attack applies to GitLab CI directly
#             analogue  a GitHub Actions attack, listed as the same attack class
#                       in GitLab CI, never as detection of that CVE
#             campaign  a named campaign without one id
#   product   the affected product
#   fixed     the first fixed version, when there is one
#   summary   one short sentence for the website, with no working attack in it
#   coverage  full, partial or none
#   rules     rule and severity the fixture testdata/advisories/<id>.yml must
#             produce; required unless coverage is none
#   reason    why glsec does not see everything; required unless coverage is full
#               not-static   needs run-time state a file scan cannot see
#               no-rule-yet  visible in a file, not reported yet; needs issue
#               by-design    deliberately not reported; needs note
#   issue     tracking issue for no-rule-yet
#   note      one sentence on what is missing
#   steps     for a campaign: each step with the rules that see it, or a reason

- id: CVE-2021-42574
  kind: cve
  product: Unicode
  summary: "Trojan Source: bidirectional controls make text read differently to a person than to a parser."
  coverage: full
  rules:
    - {rule: GL078, severity: warn}

- id: CVE-2025-10894
  kind: cve
  product: Nx
  summary: "Malicious Nx packages collected credentials and started local AI agents with their approvals disabled."
  coverage: partial
  rules:
    - {rule: GL085, severity: error}
  reason: not-static
  note: "glsec reports an agent run with approvals disabled in a pipeline, not the malicious package."

- id: CVE-2026-33634
  aliases: [GHSA-69fq-xp46-6x23]
  kind: cve
  product: Trivy
  summary: "A malicious Trivy 0.69.4 release reached jobs that pull a moving image tag."
  coverage: partial
  rules:
    - {rule: GL001, severity: error}
  reason: by-design
  note: "A version tag such as 0.69.4 is only reported with require_image_digest: true."

- id: CVE-2023-49291

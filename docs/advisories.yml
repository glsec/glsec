  kind: analogue
  product: tj-actions/branch-names
  fixed: "7.0.7"
  summary: "A crafted branch name ran as code in a workflow step."
  coverage: full
  rules:
    - {rule: GL002, severity: warn}

- id: CVE-2025-30066
  aliases: [GHSA-mrrh-fwg8-r2c3]
  kind: analogue
  product: tj-actions/changed-files
  fixed: "46.0.1"
  summary: "Moved version tags pointed every workflow that used the action at malicious code."
  coverage: partial
  rules:
    - {rule: GL003, severity: error}
    - {rule: GL041, severity: warn}
  reason: no-rule-yet
  issue: 1175
  note: "An include on a branch is reported, an include on a tag is not, and moving a tag was the attack."


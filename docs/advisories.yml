- id: Codecov Bash Uploader
  kind: campaign
  product: Codecov
  summary: "An altered uploader script, piped into a shell by CI jobs, sent their environment to the attackers."
  coverage: partial
  rules:
    - {rule: GL011, severity: error}
  reason: not-static
  note: "glsec reports the download piped into a shell, not what the script does."
  steps:
    - {step: "A job downloads a script and pipes it into a shell.", rules: [GL011]}
    - {step: "The altered script sends the job's environment out.", reason: not-static}

- id: Shai-Hulud
  kind: campaign
  product: npm
  summary: "A worm spread through install scripts that stole npm tokens and published infected versions."
  coverage: partial
  rules:
    - {rule: GL090, severity: warn}
  reason: not-static
  note: "glsec reports install scripts in a job that publishes, not the malicious dependency."
  steps:
    - {step: "A job that publishes also runs dependency install scripts.", rules: [GL090]}
    - {step: "A malicious install script steals the token and publishes.", reason: not-static}
